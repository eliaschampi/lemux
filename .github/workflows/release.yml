name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the source tarball
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(bin/lemux --version)" = "lemux $version"
          make dist
          tar -xzf "lemux-$version.tar.gz"
          test "$("./lemux-$version/bin/lemux" --version)" = "lemux $version"
          sha256sum "lemux-$version.tar.gz" > "lemux-$version.tar.gz.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          notes=$(awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          test -n "$notes"
          gh release create --verify-tag "$GITHUB_REF_NAME" "lemux-$version.tar.gz" "lemux-$version.tar.gz.sha256" \
            --title "lemux $version" --notes "$notes"
